<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 STUDIO | Pixel Perfect</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --window-bg: rgba(11, 16, 30, 0.95);
            --orange-main: #ff6b00;
            --orange-dark: #b34a00;
            --text-light: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Chakra Petch', sans-serif; }

        body {
            background-color: #000;
            background-image: url('images/482bc578-6c0c-41c5-a91d-c1ea840b343f.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            image-rendering: -webkit-optimize-contrast; image-rendering: pixelated;
            color: var(--text-light); min-height: 100vh; overflow-x: hidden; 
        }

        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background-color: rgba(9, 12, 21, 0.95); border-bottom: 4px solid var(--orange-main); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
        .logo { font-family: 'VT323', monospace; font-size: 2.5rem; color: var(--orange-main); text-shadow: 2px 2px 0px var(--orange-dark); letter-spacing: 2px; }
        .nav-links { display: flex; gap: 15px; }
        .nav-btn { background: transparent; color: var(--orange-main); border: none; font-size: 1.2rem; font-weight: 700; cursor: pointer; padding: 8px 16px; transition: 0.2s; }
        .nav-btn:hover { background: rgba(255, 107, 0, 0.2); }
        .nav-btn.active { background-color: var(--orange-main); color: #000; border-radius: 4px; }

        .container { max-width: 1000px; margin: 50px auto; padding: 0 20px; }
        .section { display: none; animation: fadeIn 0.4s ease-in-out; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        .retro-window { background-color: var(--window-bg); border: 4px solid var(--orange-main); border-radius: 8px; box-shadow: 15px 15px 0px rgba(0,0,0,0.8); overflow: hidden; backdrop-filter: blur(5px); }
        .window-header { background-color: var(--orange-main); padding: 10px 15px; display: flex; gap: 8px; align-items: center; }
        .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.3); }
        .dot.red { background-color: #ff5f56; } .dot.yellow { background-color: #ffbd2e; } .dot.green { background-color: #27c93f; }
        .window-body { padding: 50px 40px; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }

        .hero-logo { max-width: 250px; width: 100%; margin: 0 auto 30px auto; filter: invert(1) drop-shadow(4px 4px 0px var(--orange-dark)); }
        .btn-retro { background-color: var(--orange-main); color: #000; font-size: 1.8rem; font-weight: 700; padding: 15px 60px; text-decoration: none; border: 4px solid #000; box-shadow: 6px 6px 0px #000; transition: 0.2s; cursor: pointer; font-family: 'VT323'; letter-spacing: 2px; }
        
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; }
        .calendar-header button { background: #000; border: 2px solid var(--orange-main); color: var(--orange-main); padding: 5px 20px; cursor: pointer; font-family: 'VT323'; font-size: 2rem; box-shadow: 3px 3px 0 #000; }
        .calendar-header h2 { font-family: 'VT323'; color: #fff; font-size: 2.5rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background: var(--orange-main); border: 2px solid var(--orange-main); min-width: 700px; }
        .calendar-day-header { background: #111; color: var(--orange-main); text-align: center; padding: 10px; font-family: 'VT323'; font-size: 1.5rem; }
        .calendar-day { background: rgba(11, 16, 30, 0.9); min-height: 100px; padding: 5px; display: flex; flex-direction: column; position: relative; }
        .day-number { text-align: right; font-family: 'VT323'; font-size: 1.2rem; color: #666; margin-bottom: 5px; }
        .calendar-event { background: rgba(255, 107, 0, 0.2); border-left: 3px solid var(--orange-main); font-size: 0.9rem; padding: 4px; color: #fff; }
        .delete-event-btn { position: absolute; right: 2px; top: 2px; background: #ff5f56; color: #fff; border: none; font-size: 0.8rem; width: 16px; height: 16px; cursor: pointer; display: none; }
        .edit-mode .delete-event-btn { display: block; }
        
        #admin-panel { position: fixed; bottom: 20px; right: 20px; background: #000; border: 2px solid var(--orange-main); padding: 15px; display: flex; gap: 10px; z-index: 100; }
        #admin-panel button { background: #333; color: white; border: none; padding: 8px 16px; cursor: pointer; font-family: 'VT323'; font-size: 1.2rem;}
        #save-btn { background-color: var(--orange-main) !important; color: #000 !important; font-weight: bold; display: none; }
        #logout-btn { display: none; background-color: #ff5f56 !important; }
        
        #login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 999;}
        .login-box { background: #0b101e; border: 4px solid var(--orange-main); padding: 40px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 2px solid var(--orange-main); color: var(--orange-main); font-family: 'VT323'; font-size: 1.2rem;}
        .login-box button { width: 100%; background: var(--orange-main); color: #000; border: none; padding: 12px; cursor: pointer; font-family: 'VT323'; font-size: 1.5rem;}
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">101 STUDIO</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchTab(event, 'home')">HOME</button>
            <button class="nav-btn" onclick="switchTab(event, 'schedule')">SCHEDULE</button>
        </div>
    </nav>

    <div class="container">
        <main id="home" class="section active">
            <div class="retro-window">
                <div class="window-header"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                <div class="window-body">
                    <h1>101 STUDIO</h1>
                    <img src="images/Code_Generated_Image.png" class="hero-logo">
                </div>
            </div>
        </main>

        <main id="schedule" class="section">
            <div class="retro-window">
                <div class="window-header"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
                <div class="window-body">
                    <h1>QUEST CALENDAR</h1>
                    <div class="calendar-header">
                        <button onclick="changeMonth(-1)">&#9664;</button>
                        <h2 id="month-year-label">MONTH YEAR</h2>
                        <button onclick="changeMonth(1)">&#9654;</button>
                    </div>
                    <div class="calendar-grid" id="calendar-grid"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="admin-panel">
        <button id="login-show-btn">ADMIN LOGIN</button>
        <button id="save-btn">SAVE DATA</button>
        <button id="logout-btn">LOGOUT</button>
    </div>

    <div id="login-modal">
        <div class="login-box">
            <input type="email" id="email" placeholder="ADMIN EMAIL">
            <input type="password" id="password" placeholder="PASSWORD">
            <button id="login-submit-btn">ENTER</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script>
        let scheduleData = []; 
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            document.getElementById('month-year-label').textContent = `${monthNames[currentMonth]} ${currentYear}`;
            ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'].forEach(d => {
                const el = document.createElement('div'); el.className = 'calendar-day-header'; el.textContent = d; grid.appendChild(el);
            });
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            for (let i = 0; i < firstDay; i++) { grid.appendChild(document.createElement('div')); }
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div'); cell.className = 'calendar-day';
                cell.innerHTML = `<div class="day-number">${day}</div>`;
                const events = scheduleData.filter(e => e.date === dateStr);
                events.forEach((ev, idx) => {
                    const evEl = document.createElement('div'); evEl.className = 'calendar-event';
                    evEl.innerHTML = ev.title + `<button class="delete-event-btn" onclick="deleteEvent('${dateStr}', ${idx})">x</button>`;
                    cell.appendChild(evEl);
                });
                cell.onclick = () => { if(document.body.classList.contains('edit-mode')) promptAddEvent(dateStr); };
                grid.appendChild(cell);
            }
        }

        function sendLineNotify(dateStr, title) {
            const scriptUrl = "https://script.google.com/macros/s/AKfycbyMZpwenm00l090IgkRHp25TQ-Y7uVjXZVzv4ntzQz0HuUhYMkatfkHJjBMtobtGtZb/exec"; 
            const message = `\n[BOT_CN25] แจ้งเตือน!\n📅 วันที่: ${dateStr}\n📌 ภารกิจ: ${title}`;
            const formData = new URLSearchParams(); formData.append("message", message);
            fetch(scriptUrl, { method: "POST", body: formData, mode: 'no-cors' });
        }

        function promptAddEvent(dateStr) {
            const title = prompt("รายละเอียดงาน:");
            if(title) {
                scheduleData.push({ date: dateStr, title: title });
                renderCalendar();
                sendLineNotify(dateStr, title);
            }
        }

        function deleteEvent(dateStr, idx) {
            scheduleData = scheduleData.filter((_, i) => i !== scheduleData.findIndex(e => e.date === dateStr));
            renderCalendar();
        }

        function switchTab(e, id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Firebase Auth & Save logic...
        const firebaseConfig = { apiKey: "AIzaSyAME4-lEvIycQnsWHPbi7CaBlwNiu7_qFk", authDomain: "website101-1f97f.firebaseapp.com", projectId: "website101-1f97f", storageBucket: "website101-1f97f.firebasestorage.app", messagingSenderId: "1001758477689", appId: "1:1001758477689:web:80bc85fb1a2e8af90873a8" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(u => {
            if(u) { document.body.classList.add('edit-mode'); document.getElementById('save-btn').style.display='block'; }
            else { document.body.classList.remove('edit-mode'); document.getElementById('save-btn').style.display='none'; }
        });

        document.getElementById('login-show-btn').onclick = () => document.getElementById('login-modal').style.display = 'flex';
        document.getElementById('login-submit-btn').onclick = () => {
            auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
            .then(() => document.getElementById('login-modal').style.display = 'none');
        };

        document.getElementById('save-btn').onclick = () => {
            db.collection("website").doc("pixel_portfolio").set({ schedule_list: JSON.stringify(scheduleData) }, { merge: true })
            .then(() => alert("บันทึกสำเร็จ!"));
        };

        db.collection("website").doc("pixel_portfolio").get().then(doc => {
            if(doc.exists) { scheduleData = JSON.parse(doc.data().schedule_list || '[]'); renderCalendar(); }
        });

    </script>
</body>
</html>
